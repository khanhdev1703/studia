name: Deploy Stady

on:
   push:
      branches:
         - main

jobs:
   deploy:
      runs-on: self-hosted

      steps:
         - name: Update source code
           run: |
              cd /home/fire-linux/studia
              git fetch origin main
              git reset --hard origin/main

         - name: Deploy Frontend
           run: |
              cd /home/fire-linux/studia/apps/web
              npm ci
              npm run build

         - name: Deploy Backend
           run: |
              cd /home/fire-linux/studia/apps/api
              npm ci
              npm run prisma:generate
              npm run prisma:push

         - name: Restart Backend
           run: |
              pm2 restart stady-api

         - name: Health Check
           shell: bash
           run: |
              for i in {1..10}; do
                if curl -fsS http://127.0.0.1:5000/health; then
                  echo ""
                  echo "Backend is healthy."
                  exit 0
                fi

                echo "Backend chưa sẵn sàng, thử lại sau 2 giây..."
                sleep 2
              done

              echo "Backend không phản hồi sau 20 giây."
              exit 1

         - name: PM2 Status
           run: |
              pm2 status stady-api
